services:
  postgres:
    image: postgres:17-alpine
    container_name: paygo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paygo
      POSTGRES_PASSWORD: paygo
      POSTGRES_DB: paygo
    ports:
      - '5432:5432'
    volumes:
      - paygo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paygo -d paygo']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paygo-postgres-data:
