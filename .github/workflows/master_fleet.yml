# Build and deploy the PayGo API to Azure App Service (Linux).
#
# This workflow uses no third-party actions: frankielaroi/paygo restricts Actions
# to repositories owned by frankielaroi, which excludes actions/* and azure/* too.
# Checkout is a plain git fetch with the job's own token, Node comes from the
# runner's nvm, and the deploy goes through the Azure CLI, which is preinstalled
# on the ubuntu-latest image. Build and deploy share one job because passing an
# artifact between jobs would need actions/upload-artifact.
#
# Required repository secrets (service principal with Contributor on the app):
#   AZURE_CLIENT_ID
#   AZURE_CLIENT_SECRET
#   AZURE_TENANT_ID
#   DATABASE_URL            only for the manual migrate job
#
#   az ad sp create-for-rbac --name paygo-deploy \
#     --role contributor \
#     --scopes /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Web/sites/fleet
#
# "az webapp deploy" authenticates with that AAD identity, so the App Service can
# keep SCM basic authentication disabled.
#
# App Service settings to configure once, in the portal (not here):
#   - Startup Command: node dist/main.js
#     The default "npm start" runs "nest start", which needs the Nest CLI (a dev
#     dependency that is pruned out of the deployed bundle).
#   - Every variable in .env.example, DATABASE_URL and the JWT keys included.
#     The bootstrap validates the environment with zod and aborts on a missing key.
#   - TCP_DEVICE_ENABLED=false. App Service publishes only HTTP(S), so the raw
#     Teltonika listener on TCP_DEVICE_PORT cannot be reached here; run the device
#     listener where a plain TCP port can be exposed (Container Apps, AKS, a VM).
#   - One instance only. A device socket lives on exactly one process, so a second
#     replica makes sendCommand report "not connected" for devices attached to the
#     other one, which silently skips an immobilization.

name: Build and deploy Node.js app to Azure Web App - fleet

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: fleet
  AZURE_RESOURCE_GROUP: paygo
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Check out the pushed commit
        run: |
          git init --quiet .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "${{ github.token }}" | base64 -w0)" \
            fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --quiet FETCH_HEAD

      - name: Select Node.js ${{ env.NODE_VERSION }}
        run: |
          . "${NVM_DIR}/nvm.sh"
          nvm install "${NODE_VERSION}"
          # Later steps get their own shell, so publish the chosen bin directory
          # on PATH rather than relying on nvm's shell state.
          echo "$(nvm which "${NODE_VERSION}" | xargs dirname)" >> "${GITHUB_PATH}"

      - name: Report the toolchain
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Device simulator tests
        run: npm run test:tools

      - name: Build
        run: npm run build

      - name: Check the build layout
        # Any .ts file outside src/ that the build compiles widens the rootDir and
        # moves the entrypoint to dist/src/main.js, which breaks the start command.
        run: test -f dist/main.js

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package the release
        run: |
          zip -r -q release.zip \
            dist \
            node_modules \
            prisma \
            package.json \
            package-lock.json \
            -x 'prisma/seed.ts'
          ls -lh release.zip

      - name: Sign in to Azure
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          az login --service-principal \
            --username "${AZURE_CLIENT_ID}" \
            --password "${AZURE_CLIENT_SECRET}" \
            --tenant "${AZURE_TENANT_ID}" \
            --output none

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name "${AZURE_WEBAPP_NAME}" \
            --src-path release.zip \
            --type zip \
            --output none
          echo "Deployed to https://${AZURE_WEBAPP_NAME}.azurewebsites.net"

      - name: Sign out of Azure
        if: always()
        run: az logout --output none || true

  # Migrations are deliberately a separate, manually triggered job: an automatic
  # "prisma migrate deploy" on every push applies schema changes before the old
  # revision has stopped serving, and a destructive migration then has no owner.
  # Run it from the Actions tab, with the runner's IP allowed through the database
  # firewall.
  migrate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-and-deploy
    environment:
      name: production

    steps:
      - name: Check out the pushed commit
        run: |
          git init --quiet .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "${{ github.token }}" | base64 -w0)" \
            fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --quiet FETCH_HEAD

      - name: Select Node.js ${{ env.NODE_VERSION }}
        run: |
          . "${NVM_DIR}/nvm.sh"
          nvm install "${NODE_VERSION}"
          echo "$(nvm which "${NODE_VERSION}" | xargs dirname)" >> "${GITHUB_PATH}"

      - name: Install dependencies
        run: npm ci

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migration:deploy
