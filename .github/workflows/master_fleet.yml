# Build and deploy the PayGo API to Azure App Service (Linux).
#
# Required repository secret:
#   AZURE_WEBAPP_PUBLISH_PROFILE  the publish profile XML from the App Service
#                                 ("Get publish profile" in the portal overview).
#
# App Service settings to configure once, in the portal (not here):
#   - Startup Command: node dist/main.js
#     The default "npm start" runs "nest start", which needs the Nest CLI (a dev
#     dependency that is pruned out of the deployed bundle).
#   - Every variable in .env.example, DATABASE_URL and the JWT keys included.
#     The bootstrap validates the environment with zod and aborts on a missing key.
#   - WEBSITES_PORT only if the app is not reading PORT (main.ts falls back to 3000).
#
# The raw TCP device listener (TCP_DEVICE_PORT, default 5027) is not reachable
# through App Service, which only exposes HTTP(S). Set TCP_DEVICE_ENABLED=false
# here and run the device listener where a plain TCP port can be published
# (Container Apps, AKS, or a VM), or the devices will never connect.

name: Build and deploy Node.js app to Azure Web App - fleet

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: fleet
  NODE_VERSION: '22.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Device simulator tests
        run: npm run test:tools

      - name: Build
        run: npm run build

      - name: Check the build layout
        # Any .ts file outside src/ that the build compiles widens the rootDir and
        # moves the entrypoint to dist/src/main.js, which breaks the start command.
        run: test -f dist/main.js

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package the release
        run: |
          zip -r release.zip \
            dist \
            node_modules \
            prisma \
            package.json \
            package-lock.json \
            -x 'prisma/seed.ts'

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip

  # Migrations are deliberately a separate, manually triggered job: an automatic
  # "prisma migrate deploy" on every push applies schema changes before the old
  # revision has stopped serving, and a destructive migration then has no owner.
  # Run it from the Actions tab after the deploy, with DATABASE_URL set as a secret
  # and the runner's IP allowed through the database firewall.
  migrate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: deploy
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migration:deploy
